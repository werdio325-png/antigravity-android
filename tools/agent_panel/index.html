<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity Agent Input Box</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #121212;
      color: #ececec;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    textarea:focus {
      outline: none;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-2xl">
    <!-- Antigravity Input Box Container -->
    <div id="antigravity.agentSidePanelInputBox" class="relative flex flex-col w-full p-[1px] rounded-2xl bg-[#2e2e2e] shadow-2xl transition-all">
      <div class="relative flex flex-col gap-0 p-1.5 rounded-[15px] bg-[#1e1e1e]">
        
        <!-- Textarea / Input Area -->
        <div class="relative w-full">
          <textarea
            id="promptInput"
            rows="1"
            placeholder="Ask anything, @ to mention, / for actions"
            class="w-full resize-none bg-transparent px-3 pt-2 pb-1 text-sm text-[#ececec] placeholder-[#8e8e93] outline-none leading-relaxed transition-all"
            style="max-height: 240px;"
          ></textarea>
        </div>

        <!-- Action Toolbar -->
        <div class="flex w-full items-center justify-between gap-1 px-1.5 py-1">
          <!-- Left side: Add Context (+) and Model Selector -->
          <div class="flex min-w-0 flex-1 items-center gap-1.5">
            <!-- Add context (+) button -->
            <button
              id="addContextBtn"
              type="button"
              aria-label="Add context"
              class="flex items-center justify-center w-7 h-7 p-1.5 rounded-full text-[#a1a1aa] hover:text-white hover:bg-[#2e2e2e] transition-colors cursor-pointer"
            >
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
              </svg>
            </button>

            <!-- Model Selector Pill -->
            <button
              id="modelSelectorBtn"
              type="button"
              class="flex items-center h-7 gap-1 rounded-lg px-2 text-xs text-[#a1a1aa] hover:text-white hover:bg-[#2e2e2e] transition-colors cursor-pointer select-none"
            >
              <span class="truncate max-w-[160px] font-medium text-[#d4d4d8]">Gemini 3.8 Flash</span>
              <span class="opacity-60 text-[11px]">Medium</span>
              <svg class="w-3.5 h-3.5 opacity-60 ml-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 15.75 7.5-7.5 7.5 7.5" />
              </svg>
            </button>
          </div>

          <!-- Right side: Mic and Send button -->
          <div class="shrink-0 flex items-center gap-1.5">
            <!-- Mic / Speech-to-text -->
            <button
              id="micBtn"
              type="button"
              aria-label="Record Audio"
              class="flex items-center justify-center w-7 h-7 p-1 rounded-full text-[#a1a1aa] hover:text-white hover:bg-[#2e2e2e] transition-colors"
            >
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 0 0 6-6v-1.5m-6 7.5a6 6 0 0 1-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-3-3 3 3 0 0 0-3 3v6a3 3 0 0 0 3 3Z" />
              </svg>
            </button>

            <!-- Send button -->
            <button
              id="sendBtn"
              type="button"
              disabled
              aria-label="Send message"
              class="flex items-center justify-center w-7 h-7 rounded-full transition-all duration-150 bg-[#27272a] text-[#52525b] cursor-not-allowed"
            >
              <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
              </svg>
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    const input = document.getElementById('promptInput');
    const sendBtn = document.getElementById('sendBtn');

    // Авто-высота поля ввода
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 240) + 'px';

      const hasVal = input.value.trim().length > 0;
      if (hasVal) {
        sendBtn.disabled = false;
        sendBtn.className = "flex items-center justify-center w-7 h-7 rounded-full transition-all duration-150 bg-[#d8b4fe] hover:bg-[#c084fc] text-[#18181b] shadow cursor-pointer";
      } else {
        sendBtn.disabled = true;
        sendBtn.className = "flex items-center justify-center w-7 h-7 rounded-full transition-all duration-150 bg-[#27272a] text-[#52525b] cursor-not-allowed";
      }
    });

    sendBtn.addEventListener('click', () => {
      if (!input.value.trim()) return;
      alert('Отправлено: ' + input.value);
      input.value = '';
      input.dispatchEvent(new Event('input'));
    });
  </script>
</body>
</html>
