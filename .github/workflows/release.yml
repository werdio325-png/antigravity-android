name: Build & Release Antigravity Mobile APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v2.13.1)'
        required: true
        default: 'v2.13.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Android Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt zipalign apksigner zip curl unzip

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Obtain Antigravity Core
        run: |
          mkdir -p core
          echo "[*] Installing gdown..."
          pip install gdown
          echo "[*] Downloading core directly from Google Drive..."
          gdown 1cZuRdGCBUNLoBHgnmXfQKHdgvJ8SlS_V -O core/downloaded_file
          ls -lh core/downloaded_file
          
          if gzip -t core/downloaded_file 2>/dev/null; then
            echo "[*] Detected gzip archive. Unpacking..."
            tar -xzf core/downloaded_file -C core/
          elif unzip -tq core/downloaded_file 2>/dev/null; then
            echo "[*] Detected zip archive. Unpacking..."
            unzip -o core/downloaded_file -d core/
          else
            echo "[*] Treating directly as binary executable..."
            cp -f core/downloaded_file core/language_server
          fi
          
          if [ ! -f core/language_server ]; then
            BIG_FILE=$(find core/ -maxdepth 2 -type f -size +50M ! -name "downloaded_file" | head -n 1)
            if [ -n "$BIG_FILE" ]; then
              echo "[*] Located extracted core binary: $BIG_FILE"
              mv -f "$BIG_FILE" core/language_server
            fi
          fi
          
          chmod +x core/language_server
          echo "[+] Core ready! Details:"
          ls -lh core/language_server
          sha256sum core/language_server

      - name: Build Antigravity-BypassRegion APK
        run: |
          OUTPUT_APK="Antigravity-${{ steps.vars.outputs.tag }}-BypassRegion.apk" bash build.sh --prod

      - name: Build Antigravity-Vanilla APK
        run: |
          OUTPUT_APK="Antigravity-${{ steps.vars.outputs.tag }}-Vanilla.apk" bash build.sh --prod --no-bypass-region

      - name: Build Antigravity-Dev APK
        run: |
          OUTPUT_APK="Antigravity-${{ steps.vars.outputs.tag }}-Dev.apk" bash build.sh --dev

      - name: Package Core Binary Archive
        run: |
          mkdir -p output
          tar -czf output/antigravity-core-arm64-${{ steps.vars.outputs.tag }}.tar.gz -C core language_server
          ls -lh output/

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Google Antigravity Mobile ${{ steps.vars.outputs.tag }} (Universal ARM64)"
          draft: false
          prerelease: false
          files: |
            output/Antigravity-${{ steps.vars.outputs.tag }}-BypassRegion.apk
            output/Antigravity-${{ steps.vars.outputs.tag }}-Vanilla.apk
            output/Antigravity-${{ steps.vars.outputs.tag }}-Dev.apk
            output/antigravity-core-arm64-${{ steps.vars.outputs.tag }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
