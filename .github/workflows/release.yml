name: Build & Release Antigravity Mobile APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v2.13.1)'
        required: true
        default: 'v2.13.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Android Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt zipalign apksigner zip curl unzip

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Obtain Antigravity Core
        run: |
          mkdir -p core
          if [ ! -f core/language_server ]; then
            echo "[*] Downloading core archive from release v2.11.0..."
            curl -fL --retry 3 "https://github.com/werdio325-png/antigravity-android/releases/download/v2.11.0/antigravity-cores-arm64-v2.11.0.tar.gz" -o core/core.tar.gz
            tar -xzf core/core.tar.gz -C core/
            rm -f core/core.tar.gz
            if [ -f core/libserver-patched.so ]; then
              mv -f core/libserver-patched.so core/language_server
            fi
            if [ ! -f core/language_server ]; then
              BIG_FILE=$(find core/ -maxdepth 2 -type f -size +50M | head -n 1)
              if [ -n "$BIG_FILE" ]; then
                mv -f "$BIG_FILE" core/language_server
              fi
            fi
            chmod +x core/language_server
          fi
          echo "[+] Core binary ready: $(ls -lh core/language_server)"

      - name: Build Antigravity-BypassRegion APK
        run: |
          OUTPUT_APK="Antigravity-${{ steps.vars.outputs.tag }}-BypassRegion.apk" bash build.sh

      - name: Build Antigravity-Vanilla APK
        run: |
          OUTPUT_APK="Antigravity-${{ steps.vars.outputs.tag }}-Vanilla.apk" bash build.sh --no-bypass-region

      - name: Package Core Binary Archive
        run: |
          mkdir -p output
          tar -czf output/antigravity-core-arm64-${{ steps.vars.outputs.tag }}.tar.gz -C core language_server
          ls -lh output/

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Google Antigravity Mobile ${{ steps.vars.outputs.tag }} (Universal ARM64)"
          draft: false
          prerelease: false
          files: |
            output/Antigravity-${{ steps.vars.outputs.tag }}-BypassRegion.apk
            output/Antigravity-${{ steps.vars.outputs.tag }}-Vanilla.apk
            output/antigravity-core-arm64-${{ steps.vars.outputs.tag }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
